name: CI validation and deployment approval demonstration

# Documentation + source validation. NO real deployment is implemented.
# GitHub branch rules and environment required reviewers MUST be configured
# in repository settings separately; YAML alone never enforces approval.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate proposed change
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check whitespace in PR diff or current commit
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            git diff --check "$BASE_SHA" HEAD
          else
            git diff-tree --check --no-commit-id -r HEAD
          fi
      - name: Validate required documentation and links
        shell: bash
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          import re
          required = [Path('README.md'), Path('docs/architecture.md'),
                      Path('docs/changes/CHG-001-ufw-configuration.md')]
          missing = [str(path) for path in required if not path.is_file()]
          if missing:
              raise SystemExit('Required files missing: ' + ', '.join(missing))
          # Check relative Markdown links; ignore HTTPS/anchors/email.
          failures = []
          for md in Path('.').rglob('*.md'):
              if '.git' in md.parts:
                  continue
              for target in re.findall(r'(?<!!)\[[^\]]+\]\(([^)]+)\)', md.read_text(encoding='utf-8')):
                  target = target.split('#', 1)[0].strip().strip('<>')
                  if not target or ':' in target or target.startswith('/'):
                      continue
                  if not (md.parent / target).exists():
                      failures.append(f'{md}: missing {target}')
          if failures:
              raise SystemExit('Broken relative links:\n' + '\n'.join(failures))
          print('Required documents and relative Markdown links verified')
          PYCODE
      - name: Validation scope notice
        run: echo 'These are baseline checks, not a full security scan or deployment authorisation.'

  approval-demonstration:
    # Manually invoked on main; uses GitHub environment only if configured.
    # NO remote commands, deployment credentials, or deploy actions here.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Non-deployment demonstration
        run: echo 'No deployment performed. Confirm environment reviewers and prevent-self-review in GitHub settings.'
